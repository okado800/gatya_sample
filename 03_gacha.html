<!DOCTYPE html>
<html lang="ja">

<head>
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>ガチャを作ろう！ level3</title>
	<style>
		main {
			margin: 0 auto;
			width: 900px;
			height: 200px;
			margin-top: 5%;
			border: black solid 1px;
		}

		p {
			padding-top: 5%;
			text-align: center;
		}

		button {
			display: block;
			width: 150px;
			padding: 10px;
			background-color: rgb(11, 117, 59);
			color: #fff;
			margin: 50px auto;
		}
	</style>
	<script>
		//引いたレア度にに応じて中身を作り、表示しよう。（「スーパーレア、レア、ノーマル」の結果をレア度と呼称します。）
		/*
			ガチャを引くとカードがでるという想定です。
			カード種類は100種類に設定して下さい。
			1~5までは「スーパーレア」6~30までは「レア」31~100までは「ノーマル」のカードにして下さい。
			レア度の抽選が終わった後、カードの種類を抽選します、種類の確率は等分にして下さい。
			(スーパーレアが出た場合1~5までのカードのどれが出るかはどれも5分の１の確率にする)
			カードの種類の表示は「レア度＋数字＋番のカード」という表示で画面に表示させて下さい。
		*/

		onload = function () {
			document.querySelectorAll("button")[0].addEventListener("click", function () {
				//1~100までのランダムな整数を作成
				let rand = Math.floor(Math.random() * (100 + 1 - 1)) + 1;
				//出力先を取得
				let output = document.querySelector("p");
				if (rand <= 3) {
					let card = Math.floor(Math.random() * (5 + 1 - 1)) + 1;
					output.innerHTML = "スーパーレア" + card + "番のカード";

				}
				else if (rand <= 13) {
					let card = Math.floor(Math.random() * (30 + 1 - 6)) + 6;
					output.innerHTML = "レア" + card + "番のカード";
				}
				else {
					let card = Math.floor(Math.random() * (100 + 1 - 31)) + 31;
					output.innerHTML = "ノーマル" + card + "番のカード";
				}
			})
		}

	</script>
</head>

<body>
	<main>
		<p>出力結果</p>
		<button>ガチャを引く</button>
	</main>
</body>

</html>
