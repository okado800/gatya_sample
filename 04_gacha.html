<!DOCTYPE html>
<html lang="ja">

<head>
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>ガチャを作ろう！ level4</title>
	<style>
		main {
			margin: 0 auto;
			width: 900px;
			height: 400px;
			margin-top: 5%;
			border: black solid 1px;
		}

		p {
			padding-top: 5%;
			text-align: center;
		}

		button {
			display: block;
			width: 150px;
			padding: 10px;
			color: #fff;
			margin: 50px auto;
		}

		button:first-of-type {
			background-color: rgb(11, 117, 59);
		}

		button:nth-of-type(2) {
			background-color: rgb(117, 11, 99);
		}
	</style>
	<script>
		//10連ガチャを実装しよう！
		//10連ガチャのボタンを押したらガチャを10回引き10回すべての結果がpタグに表示されるようにして下さい。

		onload = () => {
			let buttonElements = document.querySelectorAll("button")
			let output = document.querySelector("p");
			//通常ガチャのイベント
			buttonElements[0].addEventListener("click", () => {
				output.innerHTML = "";
				let rand = Math.floor(Math.random() * (100 + 1 - 1)) + 1;
				if (rand <= 3) {
					let card = Math.floor(Math.random() * (5 + 1 - 1)) + 1;
					output.innerHTML = `スーパーレア${card}番のカード`;
				}
				else if (rand <= 13) {
					let card = Math.floor(Math.random() * (30 + 1 - 6)) + 6;
					output.innerHTML = `レア&nbsp${card}番のカード`;
				}
				else {
					let card = Math.floor(Math.random() * (100 + 1 - 31)) + 31;
					output.innerHTML = `ノーマル&nbsp${card}番のカード`;
				}
			});
			//10連ガチャのイベント
			buttonElements[1].addEventListener("click", () => {
				output.innerHTML = "";
				for (let i = 1; i <= 10; i++) {
					let rand = Math.floor(Math.random() * (100 + 1 - 1)) + 1;
					if (rand <= 3) {
						let card = Math.floor(Math.random() * (5 + 1 - 1)) + 1;
						output.innerHTML += `「スーパーレア${card}番のカード」`;
					}
					else if (rand <= 13) {
						let card = Math.floor(Math.random() * (30 + 1 - 6)) + 6;
						output.innerHTML += `「レア&nbsp${card}番のカード」`;
					}
					else {
						let card = Math.floor(Math.random() * (100 + 1 - 31)) + 31;
						output.innerHTML += `「ノーマル&nbsp${card}番のカード」`;
					}
				}
			});

		}

	</script>
</head>

<body>
	<main>
		<p>出力結果</p>
		<button>ガチャを引く</button>
		<button>10連ガチャを引く</button>
	</main>
</body>

</html>
